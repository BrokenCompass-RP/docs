<VirtualHost *:80>
    ServerName docs.brokencompassrp.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "http"

    # Pre-DNS validation only. Remove this restriction only with the TLS cutover.
    <Location />
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/docs.brokencompassrp.com-error.log
    CustomLog ${APACHE_LOG_DIR}/docs.brokencompassrp.com-access.log combined
</VirtualHost>
